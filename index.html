<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rizos Felices — Agenda tu cita</title>

    <!-- Meta Pixel Code -->
    <script>
      (function () {
        var ID = "%VITE_META_PIXEL_ID%";
        // Sin id válido no se carga nada. En desarrollo la variable va vacía a
        // propósito: cada prueba del equipo sería una visita falsa en los
        // informes de la cuenta de anuncios.
        if (!/^\d{6,}$/.test(ID)) return;
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', ID);
        // El de la primera carga. Los de cada paso los manda useMetaPixel.
        fbq('track', 'PageView');
      })();
    </script>
    <!-- El <noscript> va en el <body>: una imagen dentro del <head> no es HTML
         válido y el build la rechaza. -->
    <!-- End Meta Pixel Code -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Meta Pixel, sin JavaScript. Es simbólico: esta web es una SPA y sin
         JavaScript no pinta nada, así que tampoco habría flujo que medir. Va
         porque es parte del snippet que entrega Meta. -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        alt=""
        src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID%&ev=PageView&noscript=1"
      />
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
